<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Slotted</title>
  <meta name="description" content="Fits your tasks into the time you actually have.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Slotted">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#ECEEE9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121715" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" href="icon-192.png" type="image/png">
  <link rel="preload" href="archivo.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="view" tabindex="-1"></main>

  <form id="quickadd" class="quickadd" autocomplete="off">
    <div id="qa-preview" class="qa-preview" aria-live="polite"></div>
    <div class="qa-row">
      <label for="qa-input" class="visually-hidden">Add a task</label>
      <input id="qa-input" name="q" type="text" placeholder="Add a task" enterkeyhint="done" autocapitalize="sentences" spellcheck="true">
      <button type="button" class="qa-more" data-action="qa-more" aria-label="Add with details">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14M5 16h14"/><circle cx="9" cy="8" r="2.2"/><circle cx="15" cy="16" r="2.2"/></svg>
      </button>
      <button type="submit" class="qa-add">Add</button>
    </div>
  </form>

  <nav class="tabbar" aria-label="Sections">
    <button data-tab="plan" aria-label="Plan">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M4 10h16M9 14h7M9 17h4"/></svg>
      <span>Plan</span>
    </button>
    <button data-tab="tasks" aria-label="Tasks">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1.2"/><circle cx="4.5" cy="12" r="1.2"/><circle cx="4.5" cy="18" r="1.2"/></svg>
      <span>Tasks</span>
    </button>
    <button data-tab="progress" aria-label="Progress">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
      <span>Progress</span>
    </button>
    <button data-tab="setup" aria-label="Setup">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2.2"/><circle cx="8" cy="17" r="2.2"/></svg>
      <span>Setup</span>
    </button>
  </nav>

  <div id="sheet-root"></div>
  <div id="toast-root" aria-live="polite"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
